# Anspire AI Search 插件层：向 entry 列表追加工具插件行
#
# patch 语义（dsh loader applyEntryPatches）：
#   - {insert: [...]}   顶层追加 entry —— 新插件必须用这种
#   - {id, name, ...}   覆盖【已存在】的 entry；目标不存在时整条 patch 被跳过
#                       并警告 "entry not found"（v0.1.0/0.1.1 的故障根因）
#
# profile 级覆盖配置的示例见 README（按 id 定位本插件插入的行）
- insert:
    - id: anspire-ai-search
      name: 'anspire-ai-search-dsh-plugin'
